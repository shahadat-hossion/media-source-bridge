<!DOCTYPE html><html><head><title>Search &amp; Add Media</title></head><body>
<div id="LocalIspUnifiedSearchPage" data-role="page" class="page type-interior" data-require="emby-input,emby-button"><div data-role="content"><div class="content-primary lidSearchPage">
<style>
.lidSearchPage{max-width:1200px}.lidSearchBox{display:flex;align-items:center;gap:.65rem;margin:1rem 0 1.4rem}.lidSearchBox .inputContainer{flex:1;margin:0}.lidSearchBox select{padding:.55em;background:#242424;color:inherit;border:1px solid #777;border-radius:.3em}.lidSearchBox button{min-width:7rem}.lidSection{margin:1.4rem 0 2.2rem}.lidSectionHead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}.lidMuted{opacity:.7}.lidGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:1rem}.lidCard{display:flex;flex-direction:column;min-width:0;background:rgba(24,38,61,.82);border-radius:.55rem;overflow:hidden}.lidPoster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#101a2a}.lidPosterFallback{display:grid;place-items:center;font-size:3rem}.lidBody{display:flex;flex:1;flex-direction:column;gap:.35rem;padding:.75rem}.lidTitle{font-weight:700;line-height:1.25}.lidMeta{font-size:.82rem;opacity:.72}.lidAction{margin-top:auto!important;width:100%}.lidLocal{border:1px solid rgba(0,164,220,.5)}.lidRemote{border:1px solid rgba(255,255,255,.12)}.lidBadge{display:inline-block;width:max-content;padding:.13rem .4rem;border-radius:.3rem;background:rgba(0,164,220,.25);font-size:.75rem;font-weight:700}.lidStatus{min-height:1.5em;font-weight:600}.lidAdmin{margin-top:3rem;padding:1rem;border:1px solid rgba(255,255,255,.18);border-radius:.5rem}.lidCheck{display:flex;align-items:center;gap:.6rem}.lidSpinner{display:inline-block;width:1rem;height:1rem;border:.15rem solid rgba(255,255,255,.25);border-top-color:#00a4dc;border-radius:50%;animation:lidSpin .7s linear infinite}@keyframes lidSpin{to{transform:rotate(360deg)}}@media(max-width:600px){.lidSearchBox{align-items:stretch;flex-direction:column}.lidGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}}
</style>
<h2>Search &amp; Add Media</h2><p class="lidMuted">Search your Jellyfin library, media servers, and torrent providers.</p>
<style>
.lidPosterButton{display:block;width:100%;padding:0;border:0;background:transparent;cursor:pointer}
.lidPosterButton:focus-visible{outline:2px solid #00a4dc;outline-offset:-2px}
.lidTorrentTitle{padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.lidSearchStatusRow{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.lidSearchStatusRow a{margin-inline-start:auto}
</style>
<div class="lidSearchBox"><div class="inputContainer"><label class="inputLabel" for="lidQuery">Movie, show or anime</label><input id="lidQuery" is="emby-input" autocomplete="off" placeholder="Iron Man"></div><select id="lidMediaType" aria-label="Media type"><option value="">All media</option><option value="anime">Anime</option><option value="movie">Movies</option><option value="series">Shows</option><option value="other">Other</option></select><select id="lidSource" aria-label="Search source"><option value="">All sources</option><option value="ftp">FTP</option><option value="torrent">Torrent</option></select><button id="lidSearch" is="emby-button" class="raised button-submit"><span>Search</span></button></div>
<div class="lidSearchStatusRow">
    <p id="lidStatus" class="lidStatus" aria-live="polite"></p>
    <a class="raised emby-button" href="https://github.com/shahadat-hossion/media-source-bridge/issues/new" target="_blank" rel="noopener noreferrer">Report a problem</a>
</div>
<section id="lidLocalSection" class="lidSection" hidden><div class="lidSectionHead"><h3>In Your Library</h3><span id="lidLocalCount" class="lidMuted"></span></div><div id="lidLocal" class="lidGrid"></div></section>
<section id="lidRemoteSection" class="lidSection" hidden><div class="lidSectionHead"><h3>Available from Media Servers</h3><span id="lidRemoteCount" class="lidMuted"></span></div><div id="lidRemote" class="lidGrid"></div></section>
<details id="lidAdmin" class="lidAdmin" hidden><summary><strong>Search button settings</strong></summary><p class="lidMuted">Choose whether this unified search replaces Jellyfin's standard header search button.</p><label class="lidCheck"><input id="lidReplaceSearch" type="checkbox" is="emby-checkbox"><span>Replace Jellyfin's default search button</span></label><button id="lidSaveSettings" is="emby-button" class="raised"><span>Save</span></button><p id="lidSettingsStatus" class="lidMuted"></p></details>
<section id="lidTorrentSection" class="lidSection" hidden><h3>Torrent providers</h3><p id="lidTorrentSummary" class="lidMuted" role="status"></p><div id="lidTorrentCards" class="lidGrid"></div></section>
<script>(function(){
const page=document.querySelector('#LocalIspUnifiedSearchPage'),q=s=>page.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),value=(x,n)=>x?.[n[0].toLowerCase()+n.slice(1)]??x?.[n];
async function call(path, method='GET', body) {
    try {
        return await ApiClient.ajax({url:ApiClient.getUrl('Plugins/LinkAdder/'+path), type:method, dataType:'json', contentType:'application/json', data:body?JSON.stringify(body):undefined});
    } catch (error) {
        let response;
        try { response = JSON.parse(await error.text?.() ?? error.responseText ?? '{}'); } catch (_) {}
        throw new Error(response?.error || response?.detail || error.message || 'Request failed.');
    }
}
let searchToken = 0;
let searchActions;
const image=item=>item.ImageTags?.Primary?ApiClient.getScaledImageUrl(item.Id,{type:'Primary',maxWidth:360,tag:item.ImageTags.Primary}):'';


const poster=(url,title)=>url?'<img class="lidPoster" src="'+esc(url)+'" alt="'+esc(title)+' poster" loading="lazy" onerror="this.outerHTML=\'<span class=&quot;lidPoster lidPosterFallback&quot; aria-hidden=&quot;true&quot;>▣</span>\'">':'<span class="lidPoster lidPosterFallback" aria-hidden="true">▣</span>';
const posterControl=(url,title)=>'<button type="button" class="lidPosterButton" aria-label="Open '+esc(title)+'">'+poster(url,title)+'</button>';
function navigateItem(id){if(window.Dashboard?.navigate)Dashboard.navigate('details?id='+encodeURIComponent(id));else window.location.hash='#/details?id='+encodeURIComponent(id)}
function renderLocal(items){
    q('#lidLocalSection').hidden=!items.length;
    q('#lidLocalCount').textContent=items.length+' result'+(items.length===1?'':'s');
    q('#lidLocal').innerHTML=items.map(x=>'<article class="lidCard lidLocal">'+posterControl(image(x),x.Name)+
        '<div class="lidBody"><span class="lidBadge">In library</span><span class="lidTitle">'+esc(x.Name)+
        '</span><span class="lidMeta">'+esc(x.Type)+(x.ProductionYear?' · '+x.ProductionYear:'')+
        '</span><button type="button" is="emby-button" class="raised button-submit lidAction lidPlay"><span class="material-icons" aria-hidden="true">play_arrow</span><span>Play</span></button></div></article>').join('');
    q('#lidLocal').querySelectorAll('.lidLocal').forEach((card,index)=>{
        const open=()=>navigateItem(items[index].Id);
        card.querySelector('.lidPosterButton').onclick=open;
        card.querySelector('.lidPlay').onclick=async()=>{
            searchActions??=import(ApiClient.getUrl('LocalIspFtpLoader/search-actions.js'));
            const actions=await searchActions.catch(()=>{
                searchActions=null;
                return null;
            });
            if(card.isConnected)return actions?actions.playItem(items[index]):open();
        };
    });
}
async function searchLocal(query, token, filter) {
    const [actions, libraries] = await Promise.all([
        import(ApiClient.getUrl('LocalIspFtpLoader/search-actions.js')), call('Libraries').catch(() => [])
    ]);
    const items = await actions.searchLibrary(query, filter, libraries);
    if (token !== searchToken) return;
    renderLocal(items.slice(0, 30));
    return items;
}

function renderRemote(items, localItems) {
    q('#lidRemoteSection').hidden = false;
    q('#lidRemoteCount').textContent = items.length + (items.length === 1 ? ' result' : ' results');
    q('#lidRemote').innerHTML = items.length ? items.map((item, index) => {
        const category = {movie:'Movie', series:'Show', anime:'Anime'}[item.type];
        return '<article class="lidCard lidRemote">' + posterControl(item.posterUrl,item.name) + '<div class="lidBody"><span class="lidBadge">' + category + '</span><span class="lidTitle">' + esc(item.name) + '</span><span class="lidMeta">' + esc(item.source) + '</span><button type="button" is="emby-button" class="raised button-submit lidAction lidAdd" data-index="' + index + '"><span class="material-icons" aria-hidden="true">add</span><span>FTP</span></button></div></article>';
    }).join('') : '<p class="lidMuted">No matching titles were found on configured media servers.</p>';
    const buttons = q('#lidRemote').querySelectorAll('.lidAdd');
    if (!buttons.length) return;
    searchActions ??= import(ApiClient.getUrl('LocalIspFtpLoader/search-actions.js'));
    searchActions.then(actions => {
        for (const button of buttons) {
            if (!button.isConnected) continue;
            const item=items[Number(button.dataset.index)];
            actions.bind(button,item,localItems,call);
            actions.bindPoster(button.closest('.lidCard').querySelector('.lidPosterButton'),button,item.name);
        }
    }).catch(() => { for (const button of buttons) button.textContent = 'Actions unavailable'; });
}
async function searchRemote(query, token, filter, localSearch) {
    const rows = await call('Remote/SearchTitles', 'POST', {mediaType:filter, query});
    const localItems = await localSearch;
    if (token !== searchToken) return;
    const items = rows.map(row => ({name:value(row,'Name'), url:value(row,'Url'), source:value(row,'Source'), posterUrl:value(row,'PosterUrl'), type:value(row,'MediaType')}));
    renderRemote(items, localItems);
    return {items};
}

let torrentSearchModule;
function addTorrentButton(container,group,actions,torrentOnly=false){
    const button=document.createElement('button');
    button.type='button';
    button.className='raised button-submit lidAction emby-button';
    button.setAttribute('is','emby-button');
    button.innerHTML='<span class="material-icons" aria-hidden="true">add</span><span>Torrent</span>';
    button.setAttribute('aria-label',(torrentOnly?'Add ':'Open ')+group.title+' from a torrent');
    button.onclick=()=>actions.prepareTorrent(group,page,call,button,torrentOnly);
    container.append(button);
    return button;
}
function renderTorrents(result,local,remote,actions,filter){
    const groups=actions.groupTorrents(result);
    const localCards=q('#lidLocal').querySelectorAll('.lidBody');
    const remoteCards=q('#lidRemote').querySelectorAll('.lidBody');
    const localTitles=local.slice(0,30).map(item=>({title:item.Name,type:item.category,year:item.ProductionYear}));
    const remoteTitles=remote.map(item=>{
        const match=item.name.match(/\s*[(\[]((?:19|20)\d{2})[)\]]\s*$/);
        return {title:match?item.name.slice(0,match.index):item.name,type:item.type,year:match?Number(match[1]):null};
    });
    const attached=new Map();
    const cards=q('#lidTorrentCards');
    cards.replaceChildren();
    for(const group of groups){
        const target=localCards[actions.torrentMatch(group,localTitles)]??remoteCards[actions.torrentMatch(group,remoteTitles)];
        if(target){
            const existing=attached.get(target);
            if(existing){existing.releases.push(...group.releases);continue}
            attached.set(target,group);
            addTorrentButton(target,group,actions);
            continue;
        }
        const card=document.createElement('article');
        card.className='lidCard lidRemote';
        card.innerHTML=posterControl(group.posterUrl,group.title)+'<div class="lidBody"><button type="button" class="lidTitle lidTorrentTitle">'+esc(group.title)+'</button><span class="lidMeta">'+esc([group.year,group.type].filter(Boolean).join(' · '))+'</span></div>';
        const body=card.querySelector('.lidBody');
        const poster=card.querySelector('.lidPosterButton');
        const title=card.querySelector('.lidTorrentTitle');
        if(group.type==='other'){
            poster.disabled=true;
            title.disabled=true;
        }else{
            const add=addTorrentButton(body,group,actions,true);
            poster.onclick=()=>add.click();
            title.onclick=()=>add.click();
        }
        cards.append(card);
    }
    const providers=value(result,'ProviderCount');
    const failed=value(result,'FailedProviders');
    let status=result.error;
    if(!status && failed)status=failed===providers?'Torrent providers could not be searched.':'Some torrent providers could not be searched.';
    if(!status && filter==='adult' && providers===0)status='Add an adult-capable torrent provider in Setup Media, such as 0Magnet.';
    if(!status && filter==='other' && providers===0)status='Enable torrent sources and add a Torznab provider that supports Other in Setup Media.';
    if(!status && providers>0 && !groups.length)status='No matching torrent releases found.';
    q('#lidTorrentSection').hidden=!cards.childElementCount && !status;
    q('#lidTorrentSummary').hidden=!status;
    q('#lidTorrentSummary').textContent=status??'';
}
async function runSearch() {
    const token = ++searchToken;
    const query = q('#lidQuery').value.trim();
    const filter = q('#lidMediaType').value;
    const source = q('#lidSource').value;
    q('#lidLocalSection').hidden = true;
    q('#lidRemoteSection').hidden = true;
    q('#lidTorrentSection').hidden = true;
    q('#lidLocal').replaceChildren();
    q('#lidRemote').replaceChildren();
    if (query.length < 2) { q('#lidStatus').textContent = 'Enter at least two characters.'; return; }
    q('#lidStatus').innerHTML = '<span class="lidSpinner"></span> Searching media sources…';
    const torrentOnly=filter==='adult'||filter==='other';
    const localSearch = (source || torrentOnly)?Promise.resolve([]):searchLocal(query, token, filter).catch(() => []);
    const remoteSearch = (torrentOnly || source === 'torrent') ? Promise.resolve({items:[]}) : searchRemote(query, token, filter, localSearch)
        .catch(error => ({items:[], error:error.message || 'Media server results could not be loaded.'}));
    const [local,remote,torrents]=await Promise.all([
        localSearch,remoteSearch,
        source === 'ftp' ? Promise.resolve({}) : call('TorrentProviders/Search','POST',{query,mediaType:filter}).catch(error=>({error:error.message||'Torrent results could not be loaded.'}))
    ]);
    if(token!==searchToken)return;
    if(source !== 'ftp') try{
        torrentSearchModule??=import(ApiClient.getUrl('LocalIspFtpLoader/torrent-search.js'));
        const actions=await torrentSearchModule;
        if(token!==searchToken)return;
        renderTorrents(torrents,local,remote.items,actions,filter);
    }catch(_){
        torrentSearchModule=null;
        if(token!==searchToken)return;
        q('#lidTorrentSection').hidden=false;
        q('#lidTorrentSummary').hidden=false;
        q('#lidTorrentSummary').textContent='Torrent results could not be displayed.';
    }
    q('#lidStatus').textContent=remote.error||'Search complete.';
}
async function load(){
    try{const settings=await call('SearchUiSettings');q('#lidReplaceSearch').checked=Boolean(value(settings,'ReplaceDefaultSearch'))}catch(_){}
    try{
        await call('CanManage');
        q('#lidAdmin').hidden=false;
        const availability=await call('SourceAvailability');
        const showAdult=value(availability,'TorrentEnabled')&&value(availability,'AdultTorrentModeEnabled');
        const adult=q('#lidMediaType option[value=adult]');
        if(showAdult && !adult){
            const option=document.createElement('option');
            option.value='adult';option.textContent='Adult torrents';
            q('#lidMediaType').append(option);
        }
        if(!showAdult)adult?.remove();
    }catch(_){}
    setTimeout(()=>q('#lidQuery').focus(),100);
}
q('#lidMediaType').onchange=()=>{
    if(q('#lidSource').value==='ftp' && ['adult','other'].includes(q('#lidMediaType').value)) q('#lidSource').value='torrent';
    runSearch();
};
q('#lidSource').onchange=()=>{
    if(q('#lidSource').value==='ftp' && ['adult','other'].includes(q('#lidMediaType').value)) q('#lidMediaType').value='';
    runSearch();
};
q('#lidSearch').onclick=runSearch;q('#lidQuery').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();runSearch()}};q('#lidSaveSettings').onclick=async()=>{try{await call('SearchUiSettings','POST',{replaceDefaultSearch:q('#lidReplaceSearch').checked});q('#lidSettingsStatus').textContent='Saved. Refresh Jellyfin to update the header buttons.'}catch(e){q('#lidSettingsStatus').textContent=e.message}};page.addEventListener('viewshow',load);page.addEventListener('pageshow',load);load();
})();</script>
</div></div></div></body></html>
